name: Publish
on:
  push:
    branches:
      - main
      - production-2chars-2
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      upload_to_workshop:
        description: 'Upload the built mod to the Steam Workshop'
        type: boolean
        required: false
        default: false
      change_note:
        description: 'Changelog note shown to subscribers on the Workshop'
        type: string
        required: false
        default: ''
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install MegaDot
        run: |
          curl -L -o megadot.zip "https://megadot.megacrit.com/4.5.1-m.11/megadot-4.5.1-m.11-linux-x86_64-editor-csharp.zip"
          unzip -q megadot.zip -d megadot
          chmod +x megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64
          echo "GODOT_PATH=$(pwd)/megadot/MegaDot_v4.5.1-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install spine-godot extension
        run: |
          curl -fL --retry 3 -o spine-godot.zip \
            "https://spine-godot.s3.eu-central-1.amazonaws.com/4.2/4.5.1-stable/spine-godot-extension-4.2-4.5.1-stable.zip"
          unzip -oq spine-godot.zip -d "${{ github.workspace }}"
      - name: Import Godot resources
        run: |
          "$GODOT_PATH" --headless --import || true
          "$GODOT_PATH" --headless --import
      - name: Publish
        run: |
          mkdir -p "${{ github.workspace }}/output/mods"
          dotnet publish IntoTheSpireverse.csproj -c Release \
          /p:GodotPath="$GODOT_PATH" \
          /p:ModsPath="${{ github.workspace }}/output/mods/"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IntoTheSpireverse
          path: output/mods
  workshop-upload:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_workshop == true
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: IntoTheSpireverse
          path: output/mods
      - name: Upload to Steam Workshop
        uses: m00nl1ght-dev/steam-workshop-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: '2868840'
          publishedFileId: ${{ vars.WORKSHOP_ITEM_ID }}
          path: output/mods/IntoTheSpireverse
          changeNote: ${{ inputs.change_note }}
